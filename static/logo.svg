>
  <title id="robot-title">Low-resolution dot-matrix robot face</title>
  <desc id="robot-desc">A simplified friendly robot face built from large aligned circles for favicon use.</desc>

  <style>
    .dot-robot {
      --robot-shell: #d8dadd;
      --robot-dark: #2f3440;
      --robot-screen: #20242b;
      --robot-accent: #ffd21f;
    }

    .shell  { fill: var(--robot-shell); }
    .dark   { fill: var(--robot-dark); }
    .screen { fill: var(--robot-screen); }
    .accent { fill: var(--robot-accent); }
  </style>

  <defs>
    <circle id="dot" r="4.2" />
  </defs>

