# CI checks to run on every PR, or manually via workflow_dispatch
name: 🚦 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docker: ${{ steps.filter.outputs.docker }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Filter Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'drizzle.config.ts'
              - '.prettierrc'
              - '.prettierignore'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
            lockfile:
              - 'package-lock.json'
            workflows:
              - '.github/workflows/**'

  lint:
    name: 🛡️ Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prettier & ESLint
        run: npm run lint

  typecheck:
    name: 🦴 Typecheck
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run svelte-check
        run: npm run check

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Build Output
        run: |
          if [ ! -f "build/index.js" ]; then
            echo "❌ Build failed: build/index.js not found"
            exit 1
          fi
          echo "✅ Build successful"

  docker-smoke:
    name: 🐳 Docker Smoke Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: goard
          POSTGRES_PASSWORD: goard
          POSTGRES_DB: goard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://goard:goard@localhost:5432/goard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6 # zizmor: ignore[cache-poisoning] smoke image is never published
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Apply Database Schema
        run: npm run db:push -- --force

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: goard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run & Probe Container
        run: |
          set -euo pipefail
          docker run -d --name goard --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e GITHUB_TOKEN=smoke-test-token \
            goard:smoke
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 2
          done
          # /alicia exercises the server bundle and its runtime deps
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/alicia)
          logs=$(docker logs goard 2>&1)
          docker rm -f goard >/dev/null 2>&1 || true
          echo "$logs"
          echo "GET /alicia -> $code"
          if printf '%s' "$logs" | grep -qiE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)'; then
            echo "::error::Image is missing runtime dependencies"
            exit 1
          fi
          [ "$code" = "200" ] || { echo "::error::/alicia returned $code, expected 200"; exit 1; }

  dependency-review:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.lockfile == 'true' && github.event_name == 'pull_request' &&
      github.event.repository.private == false
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Review Dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  secret-scan:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan PR Diff for Secrets
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

  workflow-audit:
    name: 🛠️ Workflow Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@v0.5.6
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true

  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    needs:
      - lint
      - typecheck
      - test
      - build
      - docker-smoke
      - dependency-review
      - secret-scan
      - workflow-audit
    steps:
      - name: Render Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          label() {
            case "$1" in
              lint) echo "🛡️ Lint" ;;
              typecheck) echo "🦴 Typecheck" ;;
              test) echo "🧪 Test" ;;
              build) echo "🏗️ Build" ;;
              docker-smoke) echo "🐳 Docker Smoke" ;;
              dependency-review) echo "🔒 Dependency Audit" ;;
              secret-scan) echo "🔑 Secret Scan" ;;
              workflow-audit) echo "🛠️ Workflow Audit" ;;
              *) echo "$1" ;;
            esac
          }
          status() {
            case "$1" in
              success) echo "✅ Passed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              failure) echo "❌ Failed" ;;
              *) echo "❔ $1" ;;
            esac
          }
          {
            echo "## CI Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for job in $(echo "$NEEDS" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result')
            echo "| $(label "$job") | $(status "$result" "$job") |" >> "$GITHUB_STEP_SUMMARY"
          done
