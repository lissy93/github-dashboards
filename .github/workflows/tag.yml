# Creates a new git tag when a PR is merged, or on manual dispatch
#
# PR trigger flow:
# - Triggered whenever a PR is merged, if that PR made code changes
# - If version wasn't bumped in the PR, increment patch and update package.json
# - Otherwise use the new version already in package.json
# - Create and push an annotated tag, noting the PR, its author and the issues it resolves
#
# Manual dispatch flow:
# - If a version is provided, set package.json to that version
# - If no version is provided, increment the patch version automatically
# - Create and push the git tag
#
# The new tag then triggers the Docker, Release and Comment workflows

name: 🔖 Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 1.2.0). Leave blank to auto-increment patch.'
        required: false
        type: string
  # Safe + intentional: only runs once a reviewed PR is merged, secrets are scoped
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
    branches: [main]

concurrency:
  group: auto-version-and-tag
  cancel-in-progress: false

permissions:
  contents: read

env:
  IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  version-and-tag:
    name: 🔖 Version and Tag
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version bump and tag
      pull-requests: read # read the PR's files and closed issues
    env:
      GIT_AUTHOR_NAME: Liss-Bot
      GIT_AUTHOR_EMAIL: 87835202+liss-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: Liss-Bot
      GIT_COMMITTER_EMAIL: 87835202+liss-bot@users.noreply.github.com

    steps:
      - name: 🔢 Validate manual dispatch
        if: env.IS_MANUAL == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Manual dispatch only allowed from main (got: $DISPATCH_REF)"
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && ! printf '%s' "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '${INPUT_VERSION}'. Must be semver (e.g. 1.2.0)."
            exit 1
          fi

      - name: 📂 Check PR for code changes, version bump and resolved issues
        id: check_pr
        if: env.IS_MANUAL != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const files = await github.paginate(
              github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number }
            );
            const codePatterns = [
              /^src\//, /^static\//, /^Dockerfile$/, /^package-lock\.json$/,
              /^[^/]+\.(ts|js)$/, /^(\.dockerignore|\.npmrc|tsconfig\.json)$/,
            ];
            const codeChanged = files.some((f) => codePatterns.some((p) => p.test(f.filename)));
            const pkgChanged = files.some((f) => f.filename === 'package.json');

            let versionBumped = false;
            if (pkgChanged) {
              const { data: mergeCommit } = await github.rest.git.getCommit({
                owner, repo, commit_sha: pr.merge_commit_sha,
              });
              const getVersion = async (ref) => {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path: 'package.json', ref,
                });
                return JSON.parse(Buffer.from(data.content, 'base64').toString()).version;
              };
              const [prevVersion, mergeVersion] = await Promise.all([
                getVersion(mergeCommit.parents[0].sha), getVersion(pr.merge_commit_sha),
              ]);
              versionBumped = prevVersion !== mergeVersion;
              core.info(`Version: ${prevVersion} → ${mergeVersion}`);
            }

            const needsBump = codeChanged && !versionBumped;
            const needsTag = codeChanged || versionBumped;
            core.info(`Needs bump: ${needsBump}, Needs tag: ${needsTag}`);
            core.setOutput('needs_bump', String(needsBump));
            core.setOutput('needs_tag', String(needsTag));
            if (!needsTag || pr.user.login.startsWith('dependabot')) return;

            // Issues this PR closes, noted in the tag for the Comment workflow
            try {
              const { repository } = await github.graphql(`query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) { pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) { nodes { number repository { nameWithOwner } } }
                } }
              }`, { owner, repo, number: pr.number });
              const issues = repository.pullRequest.closingIssuesReferences.nodes
                .filter((i) => i.repository.nameWithOwner.toLowerCase() === `${owner}/${repo}`.toLowerCase())
                .map((i) => i.number);
              core.info(`Resolves: ${issues.join(', ') || 'none'}`);
              core.setOutput('issues', issues.join(','));
            } catch (e) {
              core.warning(`Failed to find resolved issues: ${e.message}`);
            }

      - name: 🛎️ Checkout repository
        if: env.IS_MANUAL == 'true' || steps.check_pr.outputs.needs_tag == 'true'
        uses: actions/checkout@v7 # zizmor: ignore[artipacked] credentials needed to push the tag
        with:
          ref: main
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: ⬆️ Bump version
        id: bump
        if: env.IS_MANUAL == 'true' || steps.check_pr.outputs.needs_bump == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$IS_MANUAL" = "true" ] && [ -n "$INPUT_VERSION" ]; then
            npm version "$INPUT_VERSION" --no-git-tag-version --allow-same-version
          else
            npm version patch --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "package.json already at $NEW_VERSION, nothing to commit"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Bump version to $NEW_VERSION"
            git push
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Create and push tag
        id: tag
        if: env.IS_MANUAL == 'true' || steps.check_pr.outputs.needs_tag == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          ISSUES: ${{ steps.check_pr.outputs.issues }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
            echo "result=existed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # comment.yml reads the PR, Resolves and Author lines, so keep their format in sync
          {
            printf 'github-dashboards v%s 🚀\n\n' "$VERSION"
            if [ -n "$PR_NUMBER" ]; then
              printf 'PR: #%s - %s\n' "$PR_NUMBER" "$PR_TITLE"
            else
              printf 'Manual release by @%s\n' "$PR_AUTHOR"
            fi
            if [ -n "$ISSUES" ]; then
              printf 'Resolves: %s\n' "$(echo "$ISSUES" | sed 's/,/, #/g; s/^/#/')"
            fi
            printf 'Author: @%s\n' "$PR_AUTHOR"
            printf 'Commit: %s\n' "$MERGE_SHA"
          } > tag-message.txt

          git tag -a "$VERSION" -F tag-message.txt
          git push origin "$VERSION"
          echo "result=created" >> "$GITHUB_OUTPUT"

      - name: 📋 Job summary
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          NEEDS_TAG: ${{ steps.check_pr.outputs.needs_tag }}
          ISSUES: ${{ steps.check_pr.outputs.issues }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          TAG_RESULT: ${{ steps.tag.outputs.result }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## 🔖 Auto Version & Tag"
            echo ""
            echo "| Step | Result |"
            echo "|------|--------|"

            if [ "$IS_MANUAL" = "true" ]; then
              echo "| Trigger | Manual dispatch by @${PR_AUTHOR} |"
            else
              echo "| PR | [#${PR_NUMBER}](${REPO_URL}/pull/${PR_NUMBER}): ${PR_TITLE} |"
              echo "| Author | @${PR_AUTHOR} |"
            fi

            if [ "$NEEDS_TAG" = "false" ]; then
              echo "| Result | ⏭️ No code changes, nothing to do |"
            fi

            if [ "$BUMPED" = "true" ]; then
              echo "| Version bump | ✅ \`${VERSION}\` ([\`${BUMP_SHA:0:7}\`](${REPO_URL}/commit/${BUMP_SHA})) |"
            else
              echo "| Version bump | ⏭️ Skipped |"
            fi

            case "$TAG_RESULT:$TAG_OUTCOME" in
              created:*) echo "| Tag | ✅ [\`${VERSION}\`](${REPO_URL}/releases/tag/${VERSION}) |" ;;
              existed:*) echo "| Tag | ⏭️ Already exists: \`${VERSION}\` |" ;;
              *:failure) echo "| Tag | ❌ Failed |" ;;
              *) echo "| Tag | ⏭️ Skipped |" ;;
            esac

            if [ -n "$ISSUES" ]; then
              LINKS=$(echo "$ISSUES" | tr ',' '\n' | sed "s|.*|[#&](${REPO_URL}/issues/&)|" | paste -sd ' ' -)
              echo "| Resolves | ${LINKS} (commented on by the Comment workflow) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
