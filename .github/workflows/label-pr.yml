# Adds labels to PRs based on their category or the files changed
# So that release notes can be grouped by change type (see .github/release.yml)

name: 🏷️ Label PR

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out PR code
    types: [opened, edited]

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: 🏷️ Apply Category Label
    # Dependabot labels its own PRs
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Determine and Apply Label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // [ label, matches Category field, matches changed file paths ]
            const categories = [
              ['🚀 Deployment', /deploy|docker|host/i, [
                /^(Dockerfile|\.dockerignore|compose\.yaml|vercel\.json|\.env\.example)$/,
              ]],
              ['📊 Data', /\bdata\b|cache|database|\bdb\b|\bapi\b/i, [
                /^src\/lib\/server\//, /^src\/routes\/api\//, /^drizzle\.config\.ts$/,
              ]],
              ['🎨 UI', /\bui\b|styl|design|frontend/i, [
                /^src\/lib\/components\//, /^src\/routes\/.*\.(svelte|css)$/, /^static\//,
              ]],
              ['📦 Dependencies', /dependenc|\bdeps\b/i, [/^(package\.json|package-lock\.json)$/]],
              ['🛠️ Build Changes', /build|\bci\b|workflow/i, [
                /^\.github\/(workflows\/|dependabot\.yml$|zizmor\.yml$)/,
                /^(vite\.config\.ts|tsconfig\.json|eslint\.config\.js|\.prettier(rc|ignore)|\.editorconfig|\.nvmrc)$/,
              ]],
              ['📕 Docs', /\bdocs?\b|documentation/i, [/\.md$/]],
              ['🚚 Refactor', /refactor/i, []],
              ['🦋 Bug Fix', /bug ?fix|^fix|hot ?fix/i, []],
              ['✨ New Feature', /feature|feat\b/i, []],
            ];

            const pr = context.payload.pull_request;
            const existing = pr.labels.map((l) => l.name);
            if (categories.some(([label]) => existing.includes(label))) {
              core.info('PR is already categorised, nothing to do');
              return;
            }

            // Read the Category field, ignoring the template's comment hints
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const stated = body.match(/^#+\s*Category\s*([^\n#]*)/m)?.[1].trim() || '';
            let labels = categories
              .filter(([, field]) => field.test(stated))
              .map(([label]) => label);

            // If no valid category was given, infer one from the files changed
            if (!labels.length) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100,
              });
              const names = files.map((f) => f.filename);
              const counts = categories.map(([label, , paths]) =>
                [label, names.filter((n) => paths.some((p) => p.test(n))).length]);
              const [label, hits] = counts.reduce((a, b) => (b[1] > a[1] ? b : a));
              if (hits * 2 > names.length) labels = [label];
            }

            if (!labels.length) {
              core.info('Unable to determine a category for this PR');
              return;
            }

            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels });
            core.info(`Applied label(s): ${labels.join(', ')}`);
