# Kept quiet on purpose: monthly, and everything grouped into a few PRs at most
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - '📦 Dependencies'
    assignees:
      - lissy93
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    ignore:
      # tracks the Node major in .nvmrc and the Dockerfile
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - '📦 Dependencies'
    assignees:
      - lissy93
    groups:
      github-actions:
        patterns:
          - '*'
